name: ci
on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: skills/android-premium-craft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/validate_skill.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/review_gate.py assets/REVIEW_EVIDENCE_TEMPLATE.json

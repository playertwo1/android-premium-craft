<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-label="Real output of ui_audit.py lint on the sloppy fixture app"><title>Real output of ui_audit.py lint on the sloppy fixture app</title><rect width="1280" height="710" rx="24" fill="#0E1514"/><rect x="40" y="40" width="1200" height="670" rx="18" fill="#161D1D" stroke="#3F4948"/><circle cx="70" cy="66" r="6" fill="#FF5F57"/><circle cx="92" cy="66" r="6" fill="#FEBC2E"/><circle cx="114" cy="66" r="6" fill="#28C840"/><text x="64" y="104" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#80D5D4" text-anchor="start" xml:space="preserve">$ python scripts/ui_audit.py lint evals/fixtures/sloppy-app --min-severity medium</text><text x="64" y="128" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#E0E3E2" text-anchor="start" xml:space="preserve">Scanned 4 files in `evals/fixtures/sloppy-app`: 5 high, 16 medium, 0 low.</text><text x="64" y="152" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFB4AB" text-anchor="start" xml:space="preserve">## A001 [high] IconButton without an accessible name (1)</text><text x="64" y="176" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Give the Icon a contentDescription naming the action.  Read: `modules/07-accessibility/accessibility.md`</text><text x="64" y="200" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">- `app/src/main/java/com/example/sloppy/HomeScreen.kt:30` `Icon(Icons.Default.Search, contentDescription = null)`</text><text x="64" y="224" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFB4AB" text-anchor="start" xml:space="preserve">## L001 [high] Scaffold content ignores innerPadding (1)</text><text x="64" y="248" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Pass innerPadding to the content (contentPadding/padding).  Read: `modules/04-layout/edge-to-edge-insets.md`</text><text x="64" y="272" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">- `app/src/main/java/com/example/sloppy/HomeScreen.kt:21` `) { _ -&gt;`</text><text x="64" y="296" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFB4AB" text-anchor="start" xml:space="preserve">## N001 [high] onBackPressed() override (not called at targetSdk 36) (1)</text><text x="64" y="320" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Use OnBackPressedCallback, BackHandler or NavigationEvent.  Read: `modules/05-components/navigation-patterns.md`</text><text x="64" y="344" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">- `app/src/main/java/com/example/sloppy/HomeScreen.kt:11` `override fun onBackPressed() {`</text><text x="64" y="368" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFB4AB" text-anchor="start" xml:space="preserve">## X001 [high] textSize in dp ignores the user font scale (1)</text><text x="64" y="392" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Use sp for text.  Read: `modules/03-system/typography.md`</text><text x="64" y="416" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">- `app/src/main/res/layout/item_row.xml:12` `android:textSize="14dp" /&gt;`</text><text x="64" y="440" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#FFB4AB" text-anchor="start" xml:space="preserve">## X003 [high] ImageButton without contentDescription (1)</text><text x="64" y="464" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Add android:contentDescription (or mark decorative).  Read: `modules/07-accessibility/accessibility.md`</text><text x="64" y="488" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">- `app/src/main/res/layout/item_row.xml:14` `&lt;ImageButton`</text><text x="64" y="512" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#F5BE48" text-anchor="start" xml:space="preserve">## A003 [medium] Clickable element sized under 48dp (1)</text><text x="64" y="536" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Add minimumInteractiveComponentSize() or sizeIn(48.dp).  Read: `modules/07-accessibility/accessibility.md`</text><text x="64" y="560" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">- `app/src/main/java/com/example/sloppy/HomeScreen.kt:32` `Box(Modifier.size(24.dp).clickable { })`</text><text x="64" y="584" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#F5BE48" text-anchor="start" xml:space="preserve">## A006 [medium] Fixed height on a text-bearing component (1)</text><text x="64" y="608" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Use heightIn(min = ...) so text can grow at 200%.  Read: `modules/03-system/typography.md`</text><text x="64" y="632" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">- `app/src/main/java/com/example/sloppy/HomeScreen.kt:26` `Text("Nested", modifier = Modifier.height(20.dp))`</text><text x="64" y="656" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#F5BE48" text-anchor="start" xml:space="preserve">## C001 [medium] Hard-coded color in UI code (1)</text><text x="64" y="680" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="400" fill="#BEC9C8" text-anchor="start" xml:space="preserve">Fix: Use MaterialTheme.colorScheme roles or extended tokens.  Read: `modules/03-system/color.md`</text></svg>